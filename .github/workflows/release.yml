name: Release

# Fork releases own the session artifacts: the linux-x64 server binary with
# the web UI embedded, plus the raw web dist bundle. The manus-dei template
# pins these releases (ADR-0001 / ADR-007).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build + smoke + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Build linux-x64 server binary (web UI embedded)
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ github.ref_name }}
        run: bun run script/build.ts --single
        working-directory: packages/opencode

      - name: Package artifacts
        run: |
          tar -czf manica-dei-linux-x64.tar.gz -C packages/opencode/dist opencode-linux-x64
          (cd packages/app && zip -qr ../../manica-dei-web-ui.zip dist)

      - name: Smoke — boot the binary and check /api/health
        run: |
          ./packages/opencode/dist/opencode-linux-x64/bin/opencode serve --hostname 127.0.0.1 --port 4096 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4096/api/health | grep -q '"healthy"'; then
              echo "health ok"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"
          exit 1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            manica-dei-linux-x64.tar.gz manica-dei-web-ui.zip
