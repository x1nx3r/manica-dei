name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs are serialized with `needs`, and every one carries `if: !cancelled()`
# so a failure upstream does not skip the suites below it. Both halves matter:
#
# - The serialization is load-bearing. The opencode subprocess tests
#   (`run-process`) assert wall-clock bounds, and two full-workspace installs
#   racing on the runner starve them into false timeouts (see 963159ff5). Running
#   the jobs concurrently reintroduces that race.
# - `!cancelled()` is what fixes the original problem: `needs: app` alone meant
#   an app failure skipped the whole opencode suite and the run still reported
#   green. `!cancelled()` keeps the ordering without the skipping.
jobs:
  typecheck:
    name: typecheck (turbo, all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun turbo typecheck

  app:
    needs: typecheck
    if: ${{ !cancelled() }}
    name: app — typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: packages/app
      - run: bun run test:unit
        working-directory: packages/app

  core:
    needs: app
    if: ${{ !cancelled() }}
    name: core — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/core

  opencode:
    needs: core
    if: ${{ !cancelled() }}
    name: opencode — test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/opencode
