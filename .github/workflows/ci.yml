name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job is independent on purpose. A `needs:` chain turns one package's
# failure into a skipped suite for another, and a run that skips tests still
# reports green. Each job installs and runs on its own.
jobs:
  typecheck:
    name: typecheck (turbo, all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun turbo typecheck

  app:
    name: app — typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: packages/app
      - run: bun run test:unit
        working-directory: packages/app

  core:
    name: core — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/core

  opencode:
    name: opencode — test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: packages/opencode
